{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Officer Login</h1>
    <p class="text-muted small">DEMO SYSTEM - fictional police accounts only.</p>

    <form method="post" data-loading novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100" data-loading-text="Signing in...">Login</button>
    </form>

    <div class="d-flex justify-content-between mt-3 small">
      <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
      <a href="{% url 'accounts:register' %}">Register as officer</a>
    </div>
  </div>
</div>
{% endblock %}
