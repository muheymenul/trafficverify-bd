{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Forgot your password?</h1>
    <p class="text-muted small">Enter the email you used when registering. We will send a reset link.</p>

    <form method="post" data-loading novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100" data-loading-text="Sending...">Send reset link</button>
    </form>

    <p class="mt-3 small mb-0"><a href="{% url 'accounts:login' %}">Back to login</a></p>
  </div>
</div>
{% endblock %}
