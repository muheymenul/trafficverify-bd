{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Change password</h1>

    <form method="post" data-loading novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100" data-loading-text="Saving...">Change password</button>
    </form>

    <p class="mt-3 small mb-0"><a href="{% url 'dashboard:settings' %}">Cancel</a></p>
  </div>
</div>
{% endblock %}
